# STATUS: LOCALLY_VALIDATED / NOT_YET_GITHUB_EXECUTED
name: yaml-validation
on: [push]
permissions:
  contents: read

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - run: python3 -c "import yaml,glob,sys;fs=sorted(set(glob.glob('**/*.yaml',recursive=True)+glob.glob('**/*.yml',recursive=True)));[yaml.safe_load(open(f)) for f in fs];print('yaml ok',len(fs),'files')"
